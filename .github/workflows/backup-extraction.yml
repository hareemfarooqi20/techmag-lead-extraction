name: Backup Nightly Lead Extraction

# 2026-09-11: secondary/backup extraction source, separate from the primary
# local Windows Task Scheduler + Docker pipeline (which uses self-hosted
# Overpass containers and runs 10 PM-7 AM on Hareem's own PC). Lives in this
# PUBLIC repo specifically so it gets unlimited free GitHub Actions minutes
# on standard runners (private-repo minutes are metered). This repo holds
# ONLY extraction code/workflow config - it never contains any lead or
# business data. Every run:
#   1. Checks out the PRIVATE techmagsolutions repo using a fine-grained PAT
#      (PRIVATE_REPO_PAT secret, scoped to Contents: Read/write on that repo
#      only) into a local folder here in the runner - not into this repo.
#   2. Runs the PK + GCC Overpass hunts against the PUBLIC Overpass API
#      (overpass-api.de) - GitHub-hosted runners can't reach the local
#      Docker containers, so OVERPASS_URL is left unset and both hunt
#      scripts fall back to the public endpoint automatically.
#   3. Commits + pushes the updated database.json straight back into the
#      PRIVATE repo (using the same PAT) - nothing is ever committed here.
#
# Sending stays with the private repo's own daily-client-acquisition.yml
# and the local nightly task; this workflow ONLY extracts.

on:
  schedule:
    - cron: '0 20 * * *'  # ~01:00 AM PKT - inside the 10PM-7AM window, offset from the local task's 10PM start so it acts as backup coverage rather than a duplicate run
  workflow_dispatch:

jobs:
  backup-extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: backup-extraction
      cancel-in-progress: false

    steps:
      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: hareemfarooqi20/techmagsolutions
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: techmagsolutions
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: techmagsolutions/automation-system
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm install --production

      - name: Run PK hunt (public Overpass, all cities/niches)
        working-directory: techmagsolutions/automation-system
        run: node src/pk-email-hunt.js

      - name: Run GCC hunt (public Overpass, all 6 countries, all niches)
        working-directory: techmagsolutions/automation-system
        run: |
          for c in "Qatar" "Oman" "Saudi Arabia" "UAE" "Kuwait" "Bahrain"; do
            echo "=== $c ==="
            HUNT_COUNTRY="$c" node src/intl-osm-hunt.js
          done

      - name: Configure Git
        working-directory: techmagsolutions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Commit and push results to private repo
        if: always()
        working-directory: techmagsolutions
        run: |
          if [ -f "automation-system/data/database.json" ]; then
            git add -f automation-system/data/database.json
          fi
          git diff --cached --quiet || {
            git commit -m "Auto: Update prospect database - $(date -u +'%Y-%m-%d') - Backup extraction run (public repo)"
            # A failed push MUST fail the job - losing database.json here
            # would silently drop this run's newly-found prospects.
            git pull --rebase origin master
            git push origin HEAD:master
          }

      - name: Log failure
        if: failure()
        run: |
          echo "Backup extraction failed. Check workflow logs."
          echo "Ensure PRIVATE_REPO_PAT secret is set and has Contents: Read/write on hareemfarooqi20/techmagsolutions."
