name: All-Day Lead Extraction

# 2026-09-12: promoted to the PRIMARY extraction source after the local
# Windows Task Scheduler + Docker pipeline's first unattended run got killed
# by its own 9-hour execution limit mid-hunt (never reached Bahrain, never
# reached the email-send step - see automation-system/data/nightly-logs on
# the private repo). Local Docker extraction is now stopped. This workflow
# lives in this PUBLIC repo so it gets unlimited free GitHub Actions minutes
# on standard runners (private-repo minutes are metered) and runs every few
# hours around the clock instead of one overnight window. This repo holds
# ONLY extraction code/workflow config - it never contains any lead or
# business data. Every run:
#   1. Checks out the PRIVATE techmagsolutions repo using a fine-grained PAT
#      (PRIVATE_REPO_PAT secret, scoped to Contents: Read/write on that repo
#      only) into a local folder here in the runner - not into this repo.
#   2. Runs the PK hunt, then loops the GCC hunt across all 6 countries,
#      both against the PUBLIC Overpass API (overpass-api.de) - GitHub
#      runners can't reach the local Docker containers, so OVERPASS_URL is
#      left unset and both hunt scripts fall back to the public endpoint.
#   3. Commits + pushes database.json back into the PRIVATE repo IMMEDIATELY
#      after each segment (PK, then each GCC country) rather than once at
#      the end - if the job times out or a later segment errors, everything
#      found before that point is still saved. This is the fix for last
#      night's local-run data-loss risk (the local script only saved
#      progress because lowdb writes to disk in real time; a GitHub runner's
#      checkout is ephemeral until pushed).
#
# Sending stays entirely with the private repo's own
# daily-client-acquisition.yml - this workflow ONLY extracts.

on:
  schedule:
    # Every 4 hours, around the clock - replaces the old 10PM-7AM-only window.
    - cron: '0 0,4,8,12,16,20 * * *'
  workflow_dispatch:

jobs:
  extraction:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: lead-extraction
      cancel-in-progress: false

    steps:
      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: hareemfarooqi20/techmagsolutions
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: techmagsolutions
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: techmagsolutions/automation-system
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'
        run: npm install --production

      - name: Configure Git
        working-directory: techmagsolutions
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 2026-10-01: a fresh runner checkout never has the union merge driver registered (it's
          # per-clone git config; .gitattributes alone doesn't activate it) - every plain `git pull
          # --rebase` that landed on a database.json changed on both sides failed outright instead of
          # combining them, about 1 in 3 runs, spamming failure emails. Same fix
          # daily-client-acquisition.yml already uses.
          bash automation-system/scripts/install-db-merge-driver.sh

      - name: Extract prospects with incremental commits
        working-directory: techmagsolutions
        run: |
          set -uo pipefail

          commit_progress() {
            local label="$1"
            if [ -f "automation-system/data/database.json" ]; then
              git add -f automation-system/data/database.json
            fi
            if ! git diff --cached --quiet; then
              git commit -m "Auto: Update prospect database - $(date -u +'%Y-%m-%d %H:%M UTC') - Extraction: $label"
              pushed=0
              for attempt in 1 2 3 4 5; do
                if git pull --rebase origin master && git push origin HEAD:master; then pushed=1; break; fi
                echo "push attempt $attempt failed for $label - aborting any half-done rebase and retrying"
                git rebase --abort 2>/dev/null || true
                sleep $((attempt * 15))
              done
              if [ "$pushed" != "1" ]; then
                echo "::warning::Could not push $label after 5 attempts - its results stay only in this runner and are lost when it's cleaned up"
              fi
            else
              echo "No new prospects from $label - nothing to commit."
            fi
          }

          echo "=== PK hunt ==="
          (cd automation-system && node src/pk-email-hunt.js) || echo "PK hunt exited non-zero - continuing to commit whatever it found"
          commit_progress "Pakistan"

          for c in "Qatar" "Oman" "Saudi Arabia" "UAE" "Kuwait" "Bahrain"; do
            echo "=== $c ==="
            (cd automation-system && HUNT_COUNTRY="$c" node src/intl-osm-hunt.js) || echo "$c hunt exited non-zero - continuing to commit whatever it found"
            commit_progress "$c"
          done

      - name: Log failure
        if: failure()
        run: |
          echo "Extraction workflow failed. Check the step logs above."
          echo "Ensure PRIVATE_REPO_PAT secret is set and has Contents: Read/write on hareemfarooqi20/techmagsolutions."
